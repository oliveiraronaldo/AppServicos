<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Serviços">
  <title>Meus Serviços</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Meus Serviços</h1>
    <button id="btnMenu" class="icon-btn" aria-label="Backup">⋮</button>
  </header>

  <main>
    <!-- Formulário -->
    <section class="card" id="formCard">
      <h2 id="formTitle">Novo serviço</h2>
      <form id="form" autocomplete="off">
        <input type="hidden" id="editId">
        <label>Data
          <input type="date" id="data" required>
        </label>
        <label>Nome do cliente
          <input type="text" id="cliente" list="listaClientes" required placeholder="Ex.: Maria Souza">
        </label>
        <datalist id="listaClientes"></datalist>
        <label>Endereço
          <input type="text" id="endereco" list="listaEnderecos" required placeholder="Rua, número, bairro">
        </label>
        <datalist id="listaEnderecos"></datalist>
        <label>Serviço realizado
          <textarea id="servico" rows="3" required placeholder="Descreva o serviço"></textarea>
        </label>
        <label>Valor (R$)
          <input type="text" id="valor" inputmode="decimal" required placeholder="0,00">
        </label>
        <div class="row">
          <button type="submit" class="btn primary" id="btnSalvar">Salvar</button>
          <button type="button" class="btn" id="btnCancelar" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Histórico -->
    <section class="card">
      <div class="hist-head">
        <h2>Histórico</h2>
        <input type="month" id="mes" aria-label="Mês">
      </div>
      <input type="search" id="busca" placeholder="Buscar cliente, endereço ou serviço">
      <p class="resumo" id="resumo"></p>
      <button class="btn primary full" id="btnPdf">📄 Gerar PDF do mês</button>
      <ul id="lista" class="lista"></ul>
    </section>
  </main>

  <!-- Menu de backup -->
  <dialog id="menu">
    <h3>Backup dos dados</h3>
    <p class="muted">Os dados ficam salvos apenas neste celular. Faça backup de vez em quando para não perder nada se limpar o navegador ou trocar de aparelho.</p>
    <button class="btn full" id="btnExport">⬇️ Exportar backup (.json)</button>
    <button class="btn full" id="btnImport">⬆️ Importar backup</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
    <form method="dialog"><button class="btn full">Fechar</button></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
