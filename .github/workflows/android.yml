name: Gerar APK Android

on:
  push:
    branches: [ccr-a93aa7cb-mdt6kr]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: |
          npm run www
          npx cap add android
          npx cap sync android

      - name: Ícone, cores e versão
        run: |
          R=android/app/src/main/res
          cp -r android-res/* $R/
          sed -i 's/#FFFFFF/#1F6FEB/I' $R/values/ic_launcher_background.xml
          sed -i 's#@drawable/splash#@color/ic_launcher_background#' $R/values/styles.xml
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android-keystore/meusservicos.keystore \
            -Pandroid.injected.signing.store.password=meusservicos \
            -Pandroid.injected.signing.key.alias=meusservicos \
            -Pandroid.injected.signing.key.password=meusservicos

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MeusServicos.apk
          gh release create "v1.${{ github.run_number }}" MeusServicos.apk \
            --target "${{ github.sha }}" --latest \
            --title "Meus Serviços 1.${{ github.run_number }}" \
            --notes "Baixe o arquivo **MeusServicos.apk** abaixo no celular Android e instale."
